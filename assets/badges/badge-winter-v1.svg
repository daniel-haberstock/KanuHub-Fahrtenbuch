<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#F9A825"/>
      <stop offset="70%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#01579B"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="52" r="48" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="50" cy="52" r="43" fill="url(#bg)"/>
  <ellipse cx="38" cy="34" rx="14" ry="8" fill="rgba(255,255,255,0.18)" transform="rotate(-30,38,34)"/>
  <!-- snowflake icon -->
  <line x1="50" y1="30" x2="50" y2="74" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="52" x2="72" y2="52" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="36" x2="66" y2="68" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="36" x2="34" y2="68" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- branch ticks -->
  <line x1="44" y1="34" x2="50" y2="30" stroke="white" stroke-width="1.5"/><line x1="56" y1="34" x2="50" y2="30" stroke="white" stroke-width="1.5"/>
  <line x1="44" y1="70" x2="50" y2="74" stroke="white" stroke-width="1.5"/><line x1="56" y1="70" x2="50" y2="74" stroke="white" stroke-width="1.5"/>
  <line x1="30" y1="46" x2="28" y2="52" stroke="white" stroke-width="1.5"/><line x1="30" y1="58" x2="28" y2="52" stroke="white" stroke-width="1.5"/>
  <line x1="70" y1="46" x2="72" y2="52" stroke="white" stroke-width="1.5"/><line x1="70" y1="58" x2="72" y2="52" stroke="white" stroke-width="1.5"/>
  <circle cx="50" cy="52" r="3" fill="white"/>
  <text x="50" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#F9A825">WINTER-</text>
  <text x="50" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#F9A825">PADDLER</text>
</svg>
