<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D6A4"/>
      <stop offset="40%" stop-color="#E8AC5A"/>
      <stop offset="70%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="52" r="48" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="50" cy="52" r="43" fill="url(#bg)"/>
  <ellipse cx="38" cy="34" rx="14" ry="8" fill="rgba(255,255,255,0.18)" transform="rotate(-30,38,34)"/>
  <!-- flower icon: 8 petals + center -->
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(45,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(90,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(135,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(180,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(225,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(270,50,52)"/>
  <ellipse cx="50" cy="38" rx="5" ry="10" fill="rgba(255,255,255,0.8)" transform="rotate(315,50,52)"/>
  <circle cx="50" cy="52" r="8" fill="#FFD54F"/>
  <text x="50" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#E8AC5A">FRÜHLINGS-</text>
  <text x="50" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#E8AC5A">PADDLER</text>
