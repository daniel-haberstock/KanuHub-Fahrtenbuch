<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E1F5FE"/>
      <stop offset="60%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="52" r="48" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="50" cy="52" r="43" fill="url(#bg)"/>
  <ellipse cx="38" cy="34" rx="14" ry="8" fill="rgba(255,255,255,0.25)" transform="rotate(-30,38,34)"/>
  <!-- diamond icon -->
  <polygon points="50,28 68,48 50,72 32,48" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  <line x1="32" y1="48" x2="68" y2="48" stroke="white" stroke-width="1.5"/>
  <line x1="50" y1="28" x2="42" y2="48" stroke="white" stroke-width="1"/>
  <line x1="50" y1="28" x2="58" y2="48" stroke="white" stroke-width="1"/>
  <line x1="42" y1="48" x2="50" y2="72" stroke="white" stroke-width="1"/>
  <line x1="58" y1="48" x2="50" y2="72" stroke="white" stroke-width="1"/>
  <text x="50" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#80D8FF">DIAMANT-</text>
  <text x="50" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#80D8FF">PADDLER</text>
</svg>
