<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="40%" stop-color="#BDBDBD"/>
      <stop offset="70%" stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7E57C2"/>
      <stop offset="100%" stop-color="#311B92"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="50" cy="52" r="48" fill="url(#ring)" filter="url(#shadow)"/>
  <circle cx="50" cy="52" r="43" fill="url(#bg)"/>
  <ellipse cx="38" cy="34" rx="14" ry="8" fill="rgba(255,255,255,0.18)" transform="rotate(-30,38,34)"/>
  <!-- clock icon (night version) -->
  <circle cx="50" cy="52" r="18" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="2.5" fill="white"/>
  <line x1="50" y1="52" x2="50" y2="38" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="42" y2="60" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="34" x2="50" y2="37" stroke="white" stroke-width="2"/>
  <line x1="50" y1="67" x2="50" y2="70" stroke="white" stroke-width="2"/>
  <line x1="32" y1="52" x2="35" y2="52" stroke="white" stroke-width="2"/>
  <line x1="65" y1="52" x2="68" y2="52" stroke="white" stroke-width="2"/>
  <text x="50" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#BDBDBD">NACHT-</text>
  <text x="50" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#BDBDBD">EULE</text>
</svg>
