<svg width="100" height="130" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </radialGradient>
    <linearGradient id="ring" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#E8AC5A"/>
      <stop offset="30%"  stop-color="#F5D6A4"/>
      <stop offset="65%"  stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0D47A1" flood-opacity="0.4"/>
    </filter>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="43"/>
    </clipPath>
  </defs>

  <!-- Bronze-Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#ring)" filter="url(#sh)"/>

  <!-- Hintergrund -->
  <circle cx="50" cy="50" r="43" fill="url(#bg)"/>

  <!-- Innerer Rahmen -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Glanz-Highlight -->
  <ellipse cx="33" cy="29" rx="16" ry="9" fill="rgba(255,255,255,0.18)" transform="rotate(-35,33,29)" clip-path="url(#clip)"/>

  <!-- Wellen-Icon -->
  <g clip-path="url(#clip)">
    <path d="M18,43 Q25.5,35 33,43 Q40.5,35 48,43 Q55.5,35 63,43 Q70.5,35 78,43"
          fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M20,54 Q27.5,46 35,54 Q42.5,46 50,54 Q57.5,46 65,54 Q72.5,46 80,54"
          fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Meilenstein-Text -->
  <text x="50" y="71" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="13" font-weight="700" fill="rgba(255,255,255,0.92)" letter-spacing="1">1 km</text>

  <!-- Badge-Name -->
  <text x="50" y="112" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" font-weight="700" fill="#1565C0" letter-spacing="1">ERSTER</text>
  <text x="50" y="124" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" font-weight="700" fill="#1565C0" letter-spacing="1">KILOMETER</text>
</svg>
