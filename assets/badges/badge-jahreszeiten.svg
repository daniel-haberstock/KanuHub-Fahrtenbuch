<svg width="100" height="130" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <linearGradient id="ring" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   stop-color="#F9A825"/>
      <stop offset="30%"  stop-color="#FFF59D"/>
      <stop offset="65%"  stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#1B5E20" flood-opacity="0.4"/>
    </filter>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="43"/>
    </clipPath>
  </defs>

  <!-- Gold-Ring -->
  <circle cx="50" cy="50" r="48" fill="url(#ring)" filter="url(#sh)"/>

  <!-- Hintergrund -->
  <circle cx="50" cy="50" r="43" fill="url(#bg)"/>
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Glanz -->
  <ellipse cx="33" cy="29" rx="16" ry="9" fill="rgba(255,255,255,0.18)" transform="rotate(-35,33,29)" clip-path="url(#clip)"/>

  <!-- 4 Jahreszeiten-Quadranten -->
  <g clip-path="url(#clip)">
    <!-- Trennlinien -->
    <line x1="50" y1="18" x2="50" y2="82" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
    <line x1="18" y1="50" x2="82" y2="50" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>

    <!-- Frühling (oben-links): Blume -->
    <circle cx="35" cy="35" r="5.5" fill="rgba(255,255,255,0.75)"/>
    <circle cx="35" cy="27" r="3.5" fill="rgba(255,182,193,0.85)"/>
    <circle cx="42" cy="31" r="3.5" fill="rgba(255,182,193,0.85)"/>
    <circle cx="42" cy="39" r="3.5" fill="rgba(255,182,193,0.85)"/>
    <circle cx="35" cy="43" r="3.5" fill="rgba(255,182,193,0.85)"/>
    <circle cx="28" cy="39" r="3.5" fill="rgba(255,182,193,0.85)"/>
    <circle cx="28" cy="31" r="3.5" fill="rgba(255,182,193,0.85)"/>

    <!-- Sommer (oben-rechts): Sonne -->
    <circle cx="65" cy="35" r="7" fill="rgba(255,220,0,0.9)"/>
    <line x1="65" y1="24" x2="65" y2="20" stroke="rgba(255,220,0,0.9)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="74" y1="26" x2="77" y2="23" stroke="rgba(255,220,0,0.9)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76" y1="35" x2="80" y2="35" stroke="rgba(255,220,0,0.9)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="74" y1="44" x2="77" y2="47" stroke="rgba(255,220,0,0.9)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Herbst (unten-links): Blatt -->
    <path d="M35,65 Q26,57 30,52 Q36,47 42,56 Q45,63 35,65 Z"
          fill="rgba(255,130,0,0.88)"/>
    <line x1="35" y1="65" x2="38.5" y2="54" stroke="rgba(255,255,255,0.45)" stroke-width="1.2"/>

    <!-- Winter (unten-rechts): Schneeflocke -->
    <line x1="65" y1="54" x2="65" y2="70" stroke="rgba(200,240,255,0.95)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="57" y1="62" x2="73" y2="62" stroke="rgba(200,240,255,0.95)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="59" y1="56" x2="71" y2="68" stroke="rgba(200,240,255,0.95)" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="59" y1="68" x2="71" y2="56" stroke="rgba(200,240,255,0.95)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Schneeflocken-Enden -->
    <circle cx="65" cy="54" r="1.5" fill="rgba(200,240,255,0.95)"/>
    <circle cx="65" cy="70" r="1.5" fill="rgba(200,240,255,0.95)"/>
    <circle cx="57" cy="62" r="1.5" fill="rgba(200,240,255,0.95)"/>
    <circle cx="73" cy="62" r="1.5" fill="rgba(200,240,255,0.95)"/>
  </g>

  <!-- Badge-Name -->
  <text x="50" y="112" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" font-weight="700" fill="#2E7D32" letter-spacing="1">VIER</text>
  <text x="50" y="124" text-anchor="middle"
        font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="9" font-weight="700" fill="#2E7D32" letter-spacing="1">JAHRESZEITEN</text>
</svg>
